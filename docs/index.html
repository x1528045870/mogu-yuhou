<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蘑菇·雨后</title>
<link rel="preload" href="fonts/fusion-pixel-10px-sc.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* VOICE: 可爱、慢，像在像素小游戏里雨后去林子边采蘑菇
   IDEA: 一块草地，雨停后冒出几朵；采进篮子，翻开像物品说明的小卡片
   PICTURE: 原创 16×16 像素蘑菇站在草地上一跳一跳，点一下飞进篮子 +1
   COLOUR and TYPE: 草绿、天蓝、羊皮纸、木头棕，菌盖橙红点睛；全站像素中文字体 Fusion Pixel（OFL）
   LAYOUT: 天 → 草地 → 篮子 → 图鉴 → 以前的雨；「喂一口」木牌浮在右下 */
@font-face{font-family:"Fusion Pixel";src:url(fonts/fusion-pixel-10px-sc.woff2) format("woff2");font-display:swap}
:root{color-scheme:light dark;
  --ink:light-dark(#3b2416,#f3e6c8);--soft:light-dark(#86613f,#c9b28a);
  --paper:light-dark(#fbefd0,#3a2e22);--paper2:light-dark(#f2dfb3,#2f251b);--shade:light-dark(#e3c993,#2a2118);
  --edge:light-dark(#5a3a22,#120b06);--wood:light-dark(#c98a4b,#8f5d31);--wood2:light-dark(#8a542a,#5e3b1f);
  --leaf:light-dark(#3f8f3a,#5fae47);--amber:light-dark(#c9821a,#d99a2e);
  --sky1:light-dark(#9fd6ee,#16213a);--sky2:light-dark(#b9e2f2,#1c2946);--sky3:light-dark(#d4eef6,#233252);
  --grass:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%237cc04f'/><rect x='7' y='9' width='1' height='2' fill='%235fa13a'/><rect x='4' y='5' width='1' height='2' fill='%235fa13a'/><rect x='15' y='10' width='1' height='2' fill='%235fa13a'/><rect x='2' y='9' width='1' height='2' fill='%235fa13a'/><rect x='0' y='14' width='1' height='2' fill='%235fa13a'/><rect x='15' y='4' width='1' height='2' fill='%235fa13a'/><rect x='7' y='3' width='1' height='2' fill='%235fa13a'/><rect x='12' y='11' width='1' height='2' fill='%235fa13a'/><rect x='0' y='10' width='1' height='2' fill='%235fa13a'/><rect x='2' y='2' width='1' height='2' fill='%235fa13a'/><rect x='10' y='14' width='1' height='2' fill='%235fa13a'/><rect x='1' y='9' width='1' height='1' fill='%23a3dc6e'/><rect x='13' y='12' width='1' height='1' fill='%23a3dc6e'/><rect x='11' y='3' width='1' height='1' fill='%23a3dc6e'/><rect x='1' y='4' width='1' height='1' fill='%23a3dc6e'/><rect x='8' y='7' width='1' height='1' fill='%23a3dc6e'/></svg>")}
@media(prefers-color-scheme:dark){:root{--grass:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%232d4a27'/><rect x='7' y='9' width='1' height='2' fill='%23223a1e'/><rect x='4' y='5' width='1' height='2' fill='%23223a1e'/><rect x='15' y='10' width='1' height='2' fill='%23223a1e'/><rect x='2' y='9' width='1' height='2' fill='%23223a1e'/><rect x='0' y='14' width='1' height='2' fill='%23223a1e'/><rect x='15' y='4' width='1' height='2' fill='%23223a1e'/><rect x='7' y='3' width='1' height='2' fill='%23223a1e'/><rect x='12' y='11' width='1' height='2' fill='%23223a1e'/><rect x='0' y='10' width='1' height='2' fill='%23223a1e'/><rect x='2' y='2' width='1' height='2' fill='%23223a1e'/><rect x='10' y='14' width='1' height='2' fill='%23223a1e'/><rect x='1' y='9' width='1' height='1' fill='%233e6334'/><rect x='13' y='12' width='1' height='1' fill='%233e6334'/><rect x='11' y='3' width='1' height='1' fill='%233e6334'/><rect x='1' y='4' width='1' height='1' fill='%233e6334'/><rect x='8' y='7' width='1' height='1' fill='%233e6334'/></svg>")}}
*{box-sizing:border-box;min-width:0}
html{background:var(--sky3)}
body{margin:0;color:var(--ink);font:20px/1.5 "Fusion Pixel","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:none;
  background:var(--grass) 0 0/64px 64px;image-rendering:pixelated;overflow-x:clip;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
a{color:inherit}button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 max(4vw,14px)}
.spr{display:block;image-rendering:pixelated}
/* 像素边框：4px 描边 + 切角 */
.px{background:var(--paper);border:4px solid var(--edge);box-shadow:inset 0 -4px 0 var(--shade);
  clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px))}
.btn{background:var(--wood);color:#fff8e6;border:4px solid var(--edge);box-shadow:inset 0 -4px 0 var(--wood2),inset 0 4px 0 rgb(255 255 255/.22);
  clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  min-height:44px;padding:2px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-shadow:2px 2px 0 var(--wood2)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--wood2)}
.btn:focus-visible{outline:4px solid #fff3b0;outline-offset:2px}
.btn.on{background:var(--leaf);box-shadow:inset 0 -4px 0 rgb(0 0 0/.25)}
.out{color:#fff8e6;text-shadow:2px 0 var(--edge),-2px 0 var(--edge),0 2px var(--edge),0 -2px var(--edge),2px 2px var(--edge),-2px -2px var(--edge),2px -2px var(--edge),-2px 2px var(--edge)}
.tag{display:inline-block;padding:2px 10px;font-size:20px}
/* 天 */
.sky{position:relative;overflow:hidden;padding-top:env(safe-area-inset-top);
  background:linear-gradient(var(--sky1) 0 34%,var(--sky2) 34% 68%,var(--sky3) 68%);border-bottom:4px solid var(--edge)}
.sky .wrap{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:28px 20px}
.cloud{position:absolute;width:96px;height:96px;opacity:.9}@media(prefers-color-scheme:dark){.cloud{opacity:.3}}
.deco{position:absolute;width:48px;height:48px;transform:translateX(-50%);pointer-events:none}.cloud .spr{width:100%;height:100%}
h1{font-weight:400;font-size:40px;line-height:1.2;margin:0 0 10px}
.drops{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s steps(4)}
.raining .drops{opacity:1}
.drops i{position:absolute;top:-24px;width:4px;height:12px;background:#6fb8ea;box-shadow:0 4px 0 #a9dcfb inset;animation:fall .9s steps(9) infinite}
@keyframes fall{to{transform:translate(-36px,260px)}}
.bag{display:flex;flex-direction:column;align-items:center;background:none;border:0;cursor:pointer;padding:0;flex:none}
.bag .spr{width:64px;height:64px}
.bag b{font-weight:400;margin-top:-8px}
.bump{animation:bump .35s steps(3)}
@keyframes bump{50%{transform:scale(1.25)}}
/* 草地 */
.field{position:relative;height:200px;overflow:hidden}
.field.empty{height:120px}
.shroom{position:absolute;bottom:22px;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.shroom .spr{width:64px;height:64px;margin:0 auto;animation:bob 1.1s steps(2) infinite}
.shroom::after{content:"";display:block;width:40px;height:6px;margin:-6px auto 0;background:rgb(0 0 0/.22)}
.shroom .tag{margin-top:6px;font-size:20px}
.shroom:hover .spr,.shroom:focus-visible .spr{animation:none;transform:translateY(-6px)}
.shroom:focus-visible{outline:4px dashed #fff3b0;outline-offset:4px}
.shroom.up{transition:transform .4s steps(4),opacity .4s steps(4);transform:translate(-50%,-80px) scale(.4);opacity:0}
@keyframes bob{50%{transform:translateY(-4px)}}
.float{position:absolute;transform:translateX(-50%);pointer-events:none;animation:floatup 1s steps(8) forwards;white-space:nowrap}
@keyframes floatup{to{transform:translate(-50%,-56px);opacity:0}}
.say{text-align:center;margin:0;padding:0 0 18px}
/* 篮子和卡片 */
h2{font-weight:400;font-size:30px;line-height:1.2;margin:34px 0 14px}
.basket{display:grid;gap:16px}
.m{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;padding:16px 16px 18px}
.m>.spr{width:48px;height:48px}
.m.new{animation:land .45s steps(5)}
@keyframes land{from{transform:translateY(-16px);opacity:0}}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--soft)}
.badge{color:#fff8e6;padding:0 8px;background:var(--leaf);box-shadow:inset 0 -2px 0 rgb(0 0 0/.25)}
.badge.sniff{background:var(--amber)}
.seen{color:var(--leaf)}
.m h3{font-weight:400;font-size:20px;line-height:1.5;margin:6px 0}
.m h3 a{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--wood)}
.m p{margin:0}.why{color:var(--soft);margin-top:6px!important}
.vote{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vote .btn{min-height:40px;padding:0 10px}
.end{margin:16px 0 0;text-align:center}
/* 图鉴 */
.guide{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:14px}
.slot{background:var(--paper2);border:0;box-shadow:inset 4px 4px 0 var(--shade),inset -4px -4px 0 rgb(255 255 255/.25);padding:12px 4px 8px;cursor:pointer;text-align:center;position:relative}
.slot:focus-visible{outline:4px solid var(--wood);outline-offset:0}
.slot .spr{width:48px;height:48px;margin:0 auto}
.slot.none .spr{filter:brightness(0);opacity:.3}
.slot b{display:block;font-weight:400}
.slot small{display:block;color:var(--soft);font-size:20px}
.past{list-style:none;margin:0;padding:6px 16px}
.past li{padding:12px 0;border-top:4px dotted var(--shade)}.past li:first-child{border-top:0}
.past time{color:var(--soft)}
.past a{display:flex;gap:8px;align-items:center;text-decoration:none;margin-top:4px}
.past a .spr{width:32px;height:32px;flex:none}
.foot{text-align:center;margin:36px 0 0}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;font-size:20px;min-height:56px;padding:0 20px}
/* 弹出卡 */
.sheet{position:fixed;inset:0;background:rgb(20 12 6/.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;max-height:84vh;overflow:auto;padding:16px 18px calc(22px + env(safe-area-inset-bottom));animation:pop .3s steps(4)}
@keyframes pop{from{transform:translateY(32px)}}
.panel h3{font-weight:400;font-size:30px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel .x{min-width:44px;padding:0}
.fed{margin:4px 0 14px;padding-left:1.2em}.fed li{margin:4px 0}
.note{background:var(--paper2);padding:8px 12px;margin:0 0 14px;color:var(--soft);box-shadow:inset 4px 4px 0 var(--shade)}
label{display:block;margin-bottom:6px}
textarea{width:100%;font:20px/1.5 "Fusion Pixel",sans-serif;color:var(--ink);background:var(--paper2);border:4px solid var(--edge);padding:8px 10px;resize:vertical;border-radius:0}
textarea:focus-visible{outline:4px solid var(--wood);outline-offset:0}
.list{list-style:none;padding:0;margin:0}.list li{padding:10px 0;border-top:4px dotted var(--shade)}
.list small{color:var(--soft);font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);padding:8px 16px;opacity:0;transition:.25s steps(3);pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet:not([hidden])~.toast{bottom:auto;top:calc(16px + env(safe-area-inset-top))}
@media(max-width:600px){
  h1{font-size:40px}.m{grid-template-columns:32px minmax(0,1fr);gap:10px;padding:14px 12px 16px}.m>.spr{width:32px;height:32px}
  .guide{grid-template-columns:repeat(3,minmax(0,1fr))}.vote{gap:6px}.vote .btn{padding:0 8px}}
@media(prefers-reduced-motion:reduce){.drops i,.shroom .spr,.float{animation:none}.shroom.up,.m.new,.panel,.bump{transition:none;animation:none}}
</style>
</head>
<body>
<header class="sky" id="sky">
  <div id="clouds"></div>
  <div class="drops" id="drops"></div>
  <div class="wrap">
    <div><h1 class="out">蘑菇·雨后</h1><p class="when px tag" id="when">……</p></div>
    <button class="bag" id="bagBtn" type="button" aria-label="篮子"><span id="bagIcon"></span><b class="out" id="bagN">×0</b></button>
  </div>
</header>
<div class="field" id="field" aria-label="草地"></div>
<main class="wrap">
  <p class="say"><span class="px tag" id="hint" aria-live="polite">……</span></p>
  <section id="basketSec" hidden>
    <h2 class="out" id="basketTitle">篮子</h2>
    <div class="basket" id="basket"></div>
    <p class="end"><span class="px tag" id="end" hidden></span></p>
  </section>
  <h2 class="out">图鉴</h2>
  <div class="px guide" id="guide"></div>
  <section id="pastSec" hidden><h2 class="out">以前的雨</h2><ul class="px past" id="past"></ul></section>
  <p class="foot"><span class="px tag" id="foot" hidden></span></p>
</main>
<button class="btn fab" id="feedBtn" type="button">喂一口</button>
<div class="sheet" id="sheet" hidden><div class="px panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="toast px" id="toast" role="status"></div>
<script>
{

const SPR={"猴头菇":["................","................","................",".....oooooo.....","...ooWWwwwwoo...","..oWWwwwwwwwwo..",".oWwwwswwswwwwo.",".owwswwwwwwswwo.","owwwwwwsswwwwwwo","owswwwwwwwwwwswo","owwwwswwwwswwwwo",".owswwwsswwwswo.",".osowsowwoswoso.","..o.so.ss.os.o..",".....o....o.....","................"],"鸡枞":["................",".......oo.......","......ogGo......",".....oggGGo.....","....ogggGGGo....","...oggggGGGGo...","..ogggggGGGGGo..",".oooooooooooooo.","......owso......","......owso......","......owso......","......owso......","......owso......",".....owwsso.....","....owwwssso....",".....oooooo....."],"竹荪":["................","......oooo......",".....onnNNo.....","....onnnNNNo....","....onnnNNNo....","....oowwssoo....","...oW.owso.Wo...","..oW.W.ws.W.Wo..","..oW.WowsoW.Wo..","..o.W.owso.W.o..",".oW.W.owso.W.Wo.",".o.W.WowsoW.W.o.",".oWWWWowsoWWWWo.",".oooooooooooooo.","......owso......",".....oooooo....."],"松茸":["..x.............",".xyx............","..x.............","....oooooooo....","..oobbbbBBBBoo..",".obbbbbbBBBBBBo.",".obbbbbbBBBBBBo.",".oBBBBBBBBBBBBo.","..ooowwwsssooo..","....owwwssso....","....owwwssso....","....owwwssso....","...owwwwsssso...","...owwwwsssso...","...owwwwsssso...","....oooooooo...."],"野蘑菇":["................","................","................","....oooooooo....","..oorrrrRRRRoo..",".orrWWrrRRWWRRo.",".orWWrrrRRRWWRo.","orrrrrrWWRRRRRRo","orrrWrrrRRRWRRRo","oRRRRRRRRRRRRRRo",".oooowwwsssoooo.","....owwwssso....","....owwwssso....","....owwwssso....","...owwwwsssso...","....oooooooo...."],"篮子":["................","................","................","................","....oooooooo....","...o........o...","..o..........o..","..o..........o..","oooooooooooooooo","otttTtttTTTTTTTo",".otTtttTTTTTTTo.",".ottttTtTTTTTTo.",".otTttttTTTTTTo.","..ottTttTTTTTo..","..oooooooooooo..","................"],"花":["................","................","................","................","................","................",". const SPECIES=[["猴头菇","慢读的长文","值得慢读的长文、论文、深度报道"],["鸡枞","新鲜事","新鲜事、新品、新消息"],["竹荪","好看的东西","好看的东西，比如图、作品、设计"],["松茸","稀有的好东西","稀有的好东西，一周最多一朵"],["野蘑菇","范围之外的","从喂过的范围之外带回来的"]];
const VERDICTS=["好吃","难吃","还想要","别再带"];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https:\/\//.test(String(u||""))?String(u):"";
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ls={get(k,d){try{const v=localStorage.getItem("mogu."+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("mogu."+k,JSON.stringify(v))}catch(e){}}};
const sprCache={};
function spr(name,cls){
  if(!sprCache[name]){const rows=SPR[name]||SPR["鸡枞"],by={};
    rows.forEach((r,y)=>[...r].forEach((c,x)=>{if(c!=="."&&PAL[c])(by[c]=by[c]||[]).push(`M${x} ${y}h1v1h-1z`)}));
    sprCache[name]=Object.entries(by).map(([c,d])=>`<path fill="${PAL[c]}" d="${d.join("")}"/>`).join("")}
  return `<svg class="spr ${cls||""}" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${sprCache[name]}</svg>`;
}

/* 钥匙：通知链接里的 #k=…，存下来后从地址栏抹掉 */
const hp=new URLSearchParams(location.hash.slice(1));
if(hp.get("k")){ls.set("key",{k:hp.get("k"),s:safe(hp.get("s"))||"https://ntfy.sh"});history.replaceState(null,"",location.pathname+location.search)}
const KEY=ls.get("key",null);
const outbox=ls.get("outbox",[]);
async function flush(){
  if(!KEY)return false;
  while(outbox.length){
    try{const r=await fetch(`${KEY.s.replace(/\/$/,"")}/${encodeURIComponent(KEY.k)}`,{method:"POST",body:JSON.stringify(outbox[0])});if(!r.ok)return false}
    catch(e){return false}
    outbox.shift();ls.set("outbox",outbox);
  }
  return true;
}
function send(ev){if(!KEY)return;outbox.push(ev);ls.set("outbox",outbox);flush()}

const fmt=iso=>{const d=new Date(iso);return isNaN(d)?"":d.toLocaleString("zh-CN",{month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"})};
function ago(iso){const h=(Date.now()-new Date(iso))/36e5;if(h<1)return"刚刚";if(h<24)return`${Math.floor(h)} 小时前`;return`${Math.floor(h/24)} 天前`}
let toastT;function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2400)}
function setTag(id,text){const el=$(id);el.textContent=text;el.hidden=!text}

const host=location.hostname,owner=host.endsWith(".github.io")?host.split(".")[0]:"",repo=location.pathname.split("/").filter(Boolean)[0]||"";
const RAW=owner&&repo?`https://raw.githubusercontent.com/${owner}/${repo}/main/`:"";
async function getJSON(name,d){for(const u of RAW?[RAW+"docs/data/"+name,"data/"+name]:["data/"+name]){try{const r=await fetch(u+"?t="+Date.now());if(r.ok)return await r.json()}catch(e){}}return d}
async function getFeed(){try{const r=await fetch((RAW||"/")+"feed.yaml?t="+Date.now());if(!r.ok)return[];const out=[];let on=false;
  for(const line of (await r.text()).split("\n")){if(/^feed:/.test(line)){on=true;continue}if(on){const m=line.match(/^\s+-\s+(.*)$/);if(m){let v=m[1].trim();if(v.startsWith('"')){try{v=JSON.parse(v)}catch(e){}}out.push(v)}else if(/^\S/.test(line))on=false}}
  return out}catch(e){return[]}}

let rains=[],status={},feedLines=[],last=null;
const picked=new Set(ls.get("picked",[])),opened=new Set(ls.get("opened",[])),votes=ls.get("votes",{});
const isPicked=m=>{
  if(picked.has(m.id))return true;
  if(!last||!last.mushrooms.includes(m))return true;                  // 以前的雨都算采过
  return !!last.picked_at&&!last.mushrooms.some(x=>picked.has(x.id));  // 在别的设备上采过
};
const issue=t=>owner&&repo?`https://github.com/${owner}/${repo}/issues/new?title=${encodeURIComponent(t)}&body=${encodeURIComponent("直接提交就行。")}`:"";

function card(m,isNew){
  const v=votes[m.id]||"",url=safe(m.url),ok=m.edible==="能吃";
  const reacts=VERDICTS.map(x=>KEY?`<button type="button" class="btn${v===x?" on":""}" data-v="${x}" data-id="${esc(m.id)}" aria-pressed="${v===x}">${x}</button>`
    :(issue(x+" "+m.id)?`<a class="btn" href="${esc(issue(x+" "+m.id))}" target="_blank" rel="noopener">${x}</a>`:"")).join("");
  return `<article class="px m${isNew?" new":""}" id="m-${esc(m.id)}">${spr(m.species)}<div>
    <div class="meta"><span>${esc(m.species)}</span><span class="badge${ok?"":" sniff"}" title="${ok?"可靠来源，能核实":"单一来源或观点，自己判断"}">${ok?"能吃":"先闻闻"}</span><span>${esc(m.source)}</span>${opened.has(m.id)?'<span class="seen">看过了</span>':""}</div>
    <h3>${url?`<a href="${esc(url)}" target="_blank" rel="noopener" data-open="${esc(m.id)}">${esc(m.title)}</a>`:esc(m.title)}</h3>
    <p>${esc(m.what)}</p><p class="why">${esc(m.why)}</p>
    ${reacts?`<div class="vote">${reacts}</div>`:""}</div></article>`;
}

const DECO=[["草",7,8],["花",19,34],["草",36,4],["花",57,40],["草",72,10],["花",88,30],["草",96,52]];
const deco=()=>DECO.map(([n,x,y])=>`<span class="deco" style="left:${x}%;bottom:${y}px">${spr(n)}</span>`).join("");
function render(newId){
  last=rains[rains.length-1]||null;
  const fresh=last?last.mushrooms.filter(m=>!isPicked(m)):[];
  const f=$("field");
  if(fresh.length){
    f.className="field";
    f.innerHTML=deco()+fresh.map((m,i)=>{const x=(i+1)/(fresh.length+1)*100+((i*37)%11-5);
      return `<button type="button" class="shroom" style="left:${x.toFixed(1)}%" data-pick="${esc(m.id)}" aria-label="采一朵${esc(m.species)}">${spr(m.species).replace("<svg",`<svg style="animation-delay:-${(i*.37).toFixed(2)}s"`)}<span class="px tag">${esc(m.species)}</span></button>`}).join("");
    setTag("hint",`冒了${NUM[fresh.length]||fresh.length}朵，点一下采！`);
  }else{
    f.className="field empty";f.innerHTML=deco();
    setTag("hint",last?"地上没有新蘑菇。雨会在说不准的时候来。":"还没下过雨。雨会在说不准的时候来。");
  }
  const inBasket=last?last.mushrooms.filter(m=>isPicked(m)):[];
  $("bagN").textContent="×"+inBasket.length;
  $("basketSec").hidden=!inBasket.length;
  $("basketTitle").textContent=fresh.length||last&&Date.now()-new Date(last.at)<864e5?"这场雨的篮子":"上一场雨的篮子";
  $("basket").innerHTML=inBasket.map(m=>card(m,m.id===newId)).join("");
  setTag("end",last&&!fresh.length?"都采完了。下一场雨说不准什么时候来。":"");
  if(newId&&!reduce){const el=$("m-"+newId);el&&el.scrollIntoView({block:"nearest",behavior:"smooth"})}

  const count={};rains.flatMap(r=>r.mushrooms).filter(isPicked).forEach(m=>count[m.species]=(count[m.species]||0)+1);
  $("guide").innerHTML=SPECIES.map(([n,d])=>`<button type="button" class="slot${count[n]?"":" none"}" data-species="${n}">${spr(n)}<b>${n}</b><small>${count[n]?"×"+count[n]:"未遇见"}</small></button>`).join("");

  const past=rains.slice(0,-1).reverse();
  $("pastSec").hidden=!past.length;
  $("past").innerHTML=past.map(r=>`<li><time>${esc(fmt(r.at))}</time>${r.mushrooms.map(m=>{const u=safe(m.url);return u?`<a href="${esc(u)}" target="_blank" rel="noopener" data-open="${esc(m.id)}">${spr(m.species)}<span>${esc(m.title)}</span></a>`:""}).join("")}</li>`).join("");

  const left=status&&status.source==="pool"&&Number.isFinite(status.pool_left)?`池子里还剩 ${status.pool_left} 朵。`:"";
  setTag("foot",left+(owner&&!KEY?" 从推送里点进来，才能在这里直接反馈和喂。":""));
}

function sky(){
  const fresh=last?last.mushrooms.filter(m=>!isPicked(m)):[];
  const when=$("when"),s=$("sky");
  if(fresh.length){
    if(reduce){when.textContent=`雨停了 · ${fmt(last.at)}`;return}
    s.classList.add("raining");when.textContent="下雨了……";
    setTimeout(()=>{s.classList.remove("raining");when.textContent=`雨停了 · ${fmt(last.at)}`},2400);
  }else when.textContent=last?`上一场雨：${ago(last.at)}`:"还没下过雨";
}

function pick(btn){
  const m=last.mushrooms.find(x=>x.id===btn.dataset.pick);if(!m||btn.disabled)return;
  btn.disabled=true;btn.classList.add("up");
  if(!reduce){const fl=document.createElement("span");fl.className="float out";fl.textContent="+1 "+m.species;fl.style.left=btn.style.left;fl.style.bottom="110px";$("field").appendChild(fl)}
  if(!last.mushrooms.some(x=>picked.has(x.id)))send({t:"p",rain:last.id});
  picked.add(m.id);ls.set("picked",[...picked]);
  setTimeout(()=>{render(m.id);const b=$("bagBtn");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")},reduce?0:420);
}

function openSheet(html,focusSel){
  $("panel").innerHTML=html;$("sheet").hidden=false;
  const f=$("panel").querySelector(focusSel||"button,textarea,a");f&&f.focus();
}
function closeSheet(){$("sheet").hidden=true;$("feedBtn").focus()}
const head=t=>`<h3 id="sheetTitle"><span>${t}</span><button type="button" class="btn x" data-close aria-label="关上">×</button></h3>`;

function feedSheet(){
  const pool=status&&status.source==="pool"?'<p class="note">原型阶段，蘑菇来自事先采好的池子。喂的东西会先记下来，等切到联网现采才真正起作用。</p>':"";
  const fed=feedLines.length?`<p style="margin:0">它吃过这些：</p><ul class="fed">${feedLines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:"";
  openSheet(head("喂一口")+fed+pool+`<label for="feedText">想让蘑菇从哪里长出来？</label>
    <textarea id="feedText" rows="3" maxlength="120" placeholder="比如：想看点关于城市夜晚的东西"></textarea>
    <p style="margin:12px 0 0"><button type="button" class="btn" id="feedGo">${KEY?"喂！":"去 GitHub 喂"}</button></p>`,"textarea");
}
function doFeed(){
  const t=$("feedText").value.trim();if(!t){$("feedText").focus();return}
  if(KEY){send({t:"f",text:t});feedLines.push(t+"（刚喂，下一次看天时收进去）");closeSheet();toast("喂进去了！")}
  else{const u=issue("喂 "+t);if(u)window.open(u,"_blank","noopener");closeSheet()}
}
function speciesSheet(name){
  const desc=(SPECIES.find(s=>s[0]===name)||[,,""])[2];
  const got=rains.flatMap(r=>r.mushrooms.map(m=>({m,at:r.at}))).filter(x=>x.m.species===name&&isPicked(x.m)).reverse();
  const list=got.length?`<ul class="list">${got.map(({m,at})=>{const u=safe(m.url);return `<li><small>${esc(fmt(at))} · ${m.edible==="能吃"?"能吃":"先闻闻"}</small><br>${u?`<a href="${esc(u)}" target="_blank" rel="noopener" data-open="${esc(m.id)}">${esc(m.title)}</a>`:esc(m.title)}</li>`}).join("")}</ul>`
    :`<p class="note">还没遇到。它会在某一场雨后冒出来。</p>`;
  openSheet(head(name)+`<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">${spr(name).replace('class="spr ','class="spr '+(got.length?"":"none ")).replace("<svg",'<svg style="width:64px;height:64px;flex:none'+(got.length?"":";filter:brightness(0);opacity:.3")+'"')}<p style="margin:0;color:var(--soft)">${esc(desc)}</p></div>`+list);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-pick],[data-v],[data-open],[data-species],[data-close],#feedBtn,#feedGo,#bagBtn");
  if(!t){if(e.target===$("sheet"))closeSheet();return}
  if(t.dataset.pick)pick(t);
  else if(t.dataset.v){const id=t.dataset.id,v=votes[id]===t.dataset.v?"":t.dataset.v;votes[id]=v;ls.set("votes",votes);send({t:"v",id,v});
    t.parentElement.querySelectorAll(".btn").forEach(b=>{b.classList.toggle("on",b.dataset.v===v);b.setAttribute("aria-pressed",b.dataset.v===v)});
    toast(v?`记下了：${v}！之后的雨会参考。`:"撤回了。")}
  else if(t.dataset.open){const id=t.dataset.open;if(!opened.has(id)){opened.add(id);ls.set("opened",[...opened]);send({t:"o",id});
    const meta=document.querySelector(`#m-${CSS.escape(id)} .meta`);if(meta&&!meta.querySelector(".seen"))meta.insertAdjacentHTML("beforeend",'<span class="seen">看过了</span>')}}
  else if(t.dataset.species)speciesSheet(t.dataset.species);
  else if("close" in t.dataset)closeSheet();
  else if(t.id==="feedBtn")feedSheet();
  else if(t.id==="feedGo")doFeed();
  else if(t.id==="bagBtn"){const s=$("basketSec");if(!s.hidden)s.scrollIntoView({behavior:reduce?"auto":"smooth"});else toast("篮子还空着。")}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});

$("bagIcon").innerHTML=spr("篮子");
$("clouds").innerHTML=[[6,8],[58,-6],[84,26]].map(([x,y])=>`<div class="cloud" style="left:${x}%;top:${y}px">${spr("云")}</div>`).join("");
$("drops").innerHTML=Array.from({length:30},()=>`<i style="left:${(Math.random()*110).toFixed(1)}%;animation-delay:-${(Math.random()*.9).toFixed(2)}s"></i>`).join("");
(async()=>{
  const [r,s,fb,feed]=await Promise.all([getJSON("rains.json",[]),getJSON("status.json",{}),getJSON("feedback.json",[]),getFeed()]);
  rains=Array.isArray(r)?r.filter(x=>x&&Array.isArray(x.mushrooms)):[];status=s&&typeof s==="object"?s:{};feedLines=feed;
  (Array.isArray(fb)?fb:[]).forEach(f=>{if(f&&f.id&&!(f.id in votes))votes[f.id]=f.verdict});
  render();sky();flush();
})();
}
</script>
</body>
</html>
